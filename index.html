<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Открытка с 7 сердечками</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Для каждого сердечка создаём свой маркер и привязываем фото -->
      <a-marker preset="hiro">
        <a-image src="img/2.jpg" position="0 0 0" scale="1 1 1" rotation="-90 0 0"></a-image>
      </a-marker>
      <!-- Сердечко 1 -->
      <a-marker type="pattern" url="pattern-first.patt">
        <a-image src="img/IMG_0946.jpg" position="0 0 0" scale="1 1 1" rotation="-90 0 0"></a-image>
      </a-marker>
      
      <!-- Сердечко 2
      <a-marker type="pattern" url="heart2.patt">
        <a-image src="photo2.jpg" position="0 0 0" scale="1 1 1" rotation="-90 0 0"></a-image>
      </a-marker> -->
      
      <!-- ... аналогично для всех 7 сердечек ... -->
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>

</html>
